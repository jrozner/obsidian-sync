services:
  obsidian-sync:
    build:
      context: .
      args:
        OB_VERSION: ${OB_VERSION:-0.0.12}
    image: obsidian-headless:${OB_VERSION:-0.0.12}
    container_name: obsidian-sync
    restart: unless-stopped

    environment:
      # Ownership for files written into the vault. Match your host user.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Optional: skip `ob login` entirely by injecting a token.
      # `ob` prefers this over /config/obsidian-headless/auth_token.
      OBSIDIAN_AUTH_TOKEN: ${OBSIDIAN_AUTH_TOKEN:-}

    volumes:
      # Durable state: auth_token + sync/<vaultId>/state.db. Losing this means
      # re-running login and sync-setup, and a full re-scan of the vault.
      - obsidian-config:/config
      # Your actual notes. Keep the container-side path at /vault so the path
      # recorded by sync-setup stays valid across runs.
      - ${VAULT_PATH:-./vault}:/vault

    command: ["ob", "sync", "--continuous"]

volumes:
  obsidian-config:
